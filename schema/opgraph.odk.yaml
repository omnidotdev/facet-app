version: "1.0"
name: FacetOpGraph

# Single source of truth for the Facet op-graph, the IR that crosses the
# TS app <-> Rust/WASM kernel boundary. ODK generates the TypeScript
# discriminated union (src/facet/opgraph.gen.ts) and the Rust serde
# internally-tagged enum (crates/facet-kernel/src/opgraph_gen.rs) from this
# file. Regenerate with `bun opgraph:generate`; never edit the outputs.
#
# `segments` uses `integer` so it stays an integer on both sides (i32 in Rust,
# number in TS); `number` would emit f64. r/h are `number` (f64). Self-refs
# (child / children) become Box<OpNode> / Vec<OpNode> in Rust and OpNode /
# OpNode[] in TS.

unions:
  OpNode:
    discriminator: op
    rename: lowercase
    variants:
      cube:
        size: number[3]
        center: boolean
      sphere:
        r: number
        segments: integer
      cylinder:
        r: number
        h: number
        segments: integer
        center: boolean
      translate:
        v: number[3]
        child: OpNode
      rotate:
        deg: number[3]
        child: OpNode
      scale:
        v: number[3]
        child: OpNode
      fillet:
        radius: number
        child: OpNode
      chamfer:
        size: number
        child: OpNode
      shell:
        thickness: number
        child: OpNode
      union:
        children: OpNode[]
      difference:
        children: OpNode[]
      intersect:
        children: OpNode[]
      # --- 2D profiles -------------------------------------------------------
      # 2D ops evaluate to a planar drawing (on the XY plane), not a solid.
      # extrude/revolve turn a drawing into a solid; the kernel enforces that an
      # extrude/revolve/offset2d child is 2D and a boolean/transform child is 3D.
      # These are B-rep-only for now (the mesh/WASM kernels report that), so they
      # route through the same auto-switch-to-B-rep path as fillet/chamfer/shell.
      circle2d:
        r: number
        segments: integer
      rect2d:
        size: number[2]
        center: boolean
      polygon2d:
        # flat x,y pairs (p0x, p0y, p1x, p1y, ...); the ring closes implicitly
        points: number[]
      svg2d:
        # an SVG path `d` string (M/L/H/V/C/S/Q/T/A/Z); the Y axis is flipped so
        # the glyph reads upright, and subpaths that wind the opposite way become
        # holes. A 2D profile, extrude/revolve it like any other sketch
        path: string
      union2d:
        children: OpNode[]
      difference2d:
        children: OpNode[]
      intersect2d:
        children: OpNode[]
      offset2d:
        # positive grows the outline outward, negative shrinks it inward
        distance: number
        child: OpNode
      # --- 2D -> 3D ----------------------------------------------------------
      extrude:
        height: number
        twist: number       # total twist in degrees over the height; 0 = none
        scale: number       # uniform scale of the top face; 1 = straight walls
        child: OpNode
      revolve:
        angle: number       # sweep in degrees about the Z axis; 360 = full
        segments: integer
        child: OpNode
      # Reflect across the plane through the origin whose normal is `normal`
      # (OpenSCAD's mirror). normal [1,0,0] flips X, [0,1,0] flips Y, etc. Works
      # in every kernel: the reflection reverses winding, which each kernel
      # corrects so the solid stays outward-facing
      mirror:
        normal: number[3]
        child: OpNode
