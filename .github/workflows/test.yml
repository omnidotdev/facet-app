name: Test 🧪

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Run tests 🦀
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          # Pin to the version that writes the committed lockfile (lockfileVersion
          # 2). An older floating Bun cannot read it, silently ignores it, and then
          # resolves fresh, which is both non-reproducible and prone to failing on
          # transitive version ranges
          bun-version: 1.4.4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # apt on hosted runners occasionally hangs on a mirror until the job cap;
      # bound each attempt and retry so a stuck mirror costs minutes, not the run
      - name: Install Tauri dependencies
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if timeout 150 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
              timeout 150 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf imagemagick; then
              exit 0
            fi
            echo "apt attempt $attempt failed, retrying"
          done
          exit 1

      # src/routeTree.gen.ts is generated by the router and gitignored, so it does
      # not exist on a clean checkout. Generate it before the type check.
      - name: Generate route tree
        run: bun routes:generate

      - name: Knip
        run: bun knip

      - name: Biome
        run: bun biome check

      - name: TypeScript
        run: bun tsc --noEmit

      - name: Unit tests
        run: bun test src

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
