name: Test 🧪

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Run tests 🦀
    # Room for a cold apt cache fill; warm runs take a couple of minutes
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Pin to the version that writes the committed lockfile (lockfileVersion
          # 2). An older floating Bun cannot read it, silently ignores it, and then
          # resolves fresh, which is both non-reproducible and prone to failing on
          # transitive version ranges
          bun-version: 1.4.4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/facet-kernel

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Restore the Tauri apt packages from cache: a cold install from the
      # runner's mirror can crawl past the job cap, a restore takes seconds
      - name: Install Tauri dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf imagemagick
          version: 2

      # The apt cache has restored the listed packages without their transitive
      # -dev files (glib-2.0.pc went missing), which only surfaced once the Rust
      # cache went cold and the -sys build scripts re-ran pkg-config. Verify the
      # libraries resolve and fall back to a real install when they do not
      - name: Verify Tauri system libraries
        run: |
          if ! pkg-config --exists glib-2.0 gtk+-3.0 webkit2gtk-4.1; then
            echo "Cached apt packages are incomplete, installing directly"
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          fi
          pkg-config --modversion glib-2.0 gtk+-3.0 webkit2gtk-4.1

      # src/routeTree.gen.ts is generated by the router and gitignored, so it does
      # not exist on a clean checkout. Generate it before the type check.
      - name: Generate route tree
        run: bun routes:generate

      - name: Knip
        run: bun knip

      - name: Biome
        run: bun biome check

      - name: TypeScript
        run: bun tsc --noEmit

      - name: Unit tests
        run: bun test src

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # The geometry kernel is a separate crate (compiled to the committed wasm
      # bundle), so it needs its own lint, format, and test gates
      - name: Kernel clippy
        run: cargo clippy --manifest-path crates/facet-kernel/Cargo.toml --all-targets -- -D warnings

      - name: Kernel formatting
        run: cargo fmt --manifest-path crates/facet-kernel/Cargo.toml --check

      - name: Kernel tests
        run: cargo test --manifest-path crates/facet-kernel/Cargo.toml
