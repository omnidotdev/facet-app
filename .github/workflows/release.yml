name: Release 🚀

# Changesets-driven, matching the fleet convention (no manual tags): a push to
# master runs the Changesets action, which opens/updates the "Version Packages"
# PR from pending changesets. Merging that PR bumps the version and lands a commit
# whose subject starts with "Version Packages", which gates the release jobs below.
# A single draft release is created first, every platform's installers upload into
# it, and it is published only once all builds succeed, so a release is never left
# split across duplicate drafts.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version 🦋
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pin to the version that writes the committed lockfile (lockfileVersion
          # 2); an older floating Bun cannot read it, ignores it, and resolves fresh
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The route tree (src/routeTree.gen.ts) is gitignored, so generate it before
      # Changesets commits "Version Packages" - the pre-commit hook runs tsc, which
      # fails on the missing module without it
      - name: Generate route tree
        run: bun routes:generate

      # Opens/updates the "Version Packages" PR; on its merge, applies the bump
      # via `bun run version` (changeset version + sync the version into the
      # src-tauri crate). privatePackages.tag is on, so the release is tagged
      - name: Create release pull request
        uses: changesets/action@v1
        with:
          version: bun run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-release:
    name: Create draft release 📦
    needs: release
    # Run on the commit that merges the Version Packages PR (its subject starts with
    # "Version Packages"; startsWith, not contains, so an unrelated commit that only
    # mentions the phrase cannot trigger a build), or on a manual dispatch
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Version Packages'))
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      # The release version, already bumped by the merged Version Packages PR
      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(bun --print "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Create one draft release up front so every matrix build job uploads into the
      # same release. Previously each job let tauri-action create its own release,
      # and they raced into duplicate drafts with the installers split across them.
      # Reuse an existing release for this tag if one is already present (a re-run).
      - name: Create draft release
        id: create
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          result-encoding: string
          script: |
            const version = '${{ steps.version.outputs.version }}'
            const tag = `v${version}`
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })
            const existing = releases.find((r) => r.tag_name === tag)
            if (existing) return String(existing.id)
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Facet ${tag}`,
              draft: true,
              prerelease: false,
            })
            return String(data.id)

  build:
    name: Build ${{ matrix.platform }} 🛠️
    needs: create-release
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # One native build per OS. Each runner bundles the installers for its own
        # host target: macOS .dmg, Windows .msi, Linux AppImage + .deb + .rpm.
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      # The Rust toolchain is for the src-tauri crate only. Facet's WASM kernel is
      # vendored in src/wasm, so the frontend build needs no Rust and there is no
      # wasm-pack / kernel build step here.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Install Tauri dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No separate route-generation step: tauri-action runs tauri.conf.json's
      # beforeBuildCommand (bun run build = tsr generate && tsc && vite build), so
      # the gitignored route tree (src/routeTree.gen.ts) is generated inside the build.
      - name: Build and upload installers
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing. Set these repository secrets to produce signed
          # updater artifacts; without them the build still produces unsigned
          # installers. The auto-updater itself is OFF until a signing keypair and an
          # updater pubkey are configured in tauri.conf.json (createUpdaterArtifacts
          # is false and plugins.updater has no pubkey today), so there is no
          # includeUpdaterJson / createUpdaterArtifacts flag here yet. Enabling the
          # updater is a follow-up: generate a minisign keypair with
          # `bun tauri signer generate`, set the pubkey + endpoints in tauri.conf.json,
          # flip createUpdaterArtifacts to true, add TAURI_SIGNING_* below, then add
          # `includeUpdaterJson: true` to emit latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Platform code signing is intentionally not wired up yet (installers ship
          # unsigned). To sign, add the certs/creds as repository secrets and set the
          # matching tauri-action env: macOS -> APPLE_CERTIFICATE,
          # APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
          # APPLE_PASSWORD (app-specific), APPLE_TEAM_ID for Developer ID signing +
          # notarization; Windows -> a code-signing certificate configured via
          # tauri.conf.json bundle.windows.certificateThumbprint (or an external
          # signing command). No certs or keys are committed to this repo.
        with:
          # Upload into the single draft release created above instead of creating a
          # release per matrix job (which raced into duplicate drafts).
          releaseId: ${{ needs.create-release.outputs.release_id }}

  publish-release:
    name: Publish release 🚀
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Flip the draft to a published release and mark it latest, now that every
      # platform's installers have uploaded. Publishing creates the git tag.
      - name: Publish release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
              make_latest: 'true',
            })

      # Publish the prebuilt GUI package (facet-bin) to the AUR. A no-op until
      # AUR_SSH_PRIVATE_KEY is set, so nothing runs before the package is registered
      # and the key is added. Runs after the release is published above, so the
      # public asset URLs the checksum step curls already resolve.
      - name: Publish to AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ needs.create-release.outputs.version }}
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          cat >> ~/.ssh/config <<SSH
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          SSH
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null

          pkg="facet-bin"
          git clone "ssh://aur@aur.archlinux.org/${pkg}.git" "${pkg}" 2>/dev/null || {
            mkdir "${pkg}" && cd "${pkg}" && git init && git remote add origin "ssh://aur@aur.archlinux.org/${pkg}.git" && cd ..
          }
          cd "${pkg}"
          cp "../misc/packaging/aur/${pkg}/PKGBUILD" .
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD

          # Compute checksums for the source URLs (replaces updpkgsums)
          checksums=()
          while IFS= read -r src; do
            url="${src#*::}"
            checksums+=("$(curl -fsSL "$url" | sha256sum | awk '{print $1}')")
          done < <(bash -c "source PKGBUILD 2>/dev/null; printf '%s\n' \"\${source[@]}\"")

          # Replace the sha256sums placeholder with the computed values
          perl -i -0777 -pe 's/^sha256sums=\(.*?\)\n//ms' PKGBUILD
          {
            printf "sha256sums=("
            for i in "${!checksums[@]}"; do
              [[ $i -gt 0 ]] && printf "\n            "
              printf "'%s'" "${checksums[$i]}"
            done
            printf ")\n"
          } >> PKGBUILD

          # Generate .SRCINFO (replaces makepkg --printsrcinfo)
          (
            source PKGBUILD 2>/dev/null
            printf "pkgbase = %s\n" "$pkgname"
            printf "\tpkgdesc = %s\n" "$pkgdesc"
            printf "\tpkgver = %s\n" "$pkgver"
            printf "\tpkgrel = %s\n" "$pkgrel"
            printf "\turl = %s\n" "$url"
            for v in "${arch[@]}"; do printf "\tarch = %s\n" "$v"; done
            for v in "${license[@]}"; do printf "\tlicense = %s\n" "$v"; done
            for v in "${makedepends[@]}"; do printf "\tmakedepends = %s\n" "$v"; done
            for v in "${depends[@]}"; do printf "\tdepends = %s\n" "$v"; done
            [[ -v provides ]] && for v in "${provides[@]}"; do printf "\tprovides = %s\n" "$v"; done
            [[ -v conflicts ]] && for v in "${conflicts[@]}"; do printf "\tconflicts = %s\n" "$v"; done
            [[ -v noextract ]] && for v in "${noextract[@]}"; do printf "\tnoextract = %s\n" "$v"; done
            for v in "${source[@]}"; do printf "\tsource = %s\n" "$v"; done
            for v in "${sha256sums[@]}"; do printf "\tsha256sums = %s\n" "$v"; done
            printf "\n"
            printf "pkgname = %s\n" "$pkgname"
          ) > .SRCINFO

          git config user.name "Omni"
          git config user.email "team@omni.dev"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || git commit -m "Update to v${VERSION}"
          git push origin master

          rm -f ~/.ssh/aur
