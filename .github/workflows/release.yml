name: Release 🚀

# Changesets-driven, matching the fleet convention (no manual tags): a push to
# master runs the Changesets action, which opens/updates the "Version Packages"
# PR from pending changesets. Merging that PR bumps the version and lands a
# commit titled "Version Packages", which gates the build job below so the
# desktop installers are cut automatically on each release.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version 🦋
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # The route tree (src/routeTree.gen.ts) is gitignored, so generate it before
      # Changesets commits "Version Packages" - the pre-commit hook runs tsc, which
      # fails on the missing module without it
      - name: Generate route tree
        run: bun routes:generate

      # Opens/updates the "Version Packages" PR; on its merge, applies the bump
      # via `bun run version` (changeset version + sync the version into the
      # src-tauri crate). privatePackages.tag is on, so the release is tagged
      - name: Create release pull request
        uses: changesets/action@v1
        with:
          version: bun run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.platform }} 🛠️
    needs: release
    # Only build installers on the commit that merges the Version Packages PR
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Version Packages')
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # One native build per OS. Each runner bundles the installers for its own
        # host target: macOS .dmg, Windows .msi, Linux AppImage + .deb.
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      # The Rust toolchain is for the src-tauri crate only. Facet's WASM kernel is
      # vendored in src/wasm, so the frontend build needs no Rust and there is no
      # wasm-pack / kernel build step here.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: bun install

      # The release version, already bumped by the merged Version Packages PR
      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(bun --print "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # No separate route-generation step: tauri-action runs tauri.conf.json's
      # beforeBuildCommand (bun run build = tsr generate && tsc && vite build), so
      # the gitignored route tree (src/routeTree.gen.ts) is generated inside the build.
      - name: Build and release Facet
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing. Set these repository secrets to produce signed
          # updater artifacts; without them the build still produces unsigned
          # installers. The auto-updater itself is OFF until a signing keypair and an
          # updater pubkey are configured in tauri.conf.json (createUpdaterArtifacts
          # is false and plugins.updater has no pubkey today), so there is no
          # includeUpdaterJson / createUpdaterArtifacts flag here yet. Enabling the
          # updater is a follow-up: generate a minisign keypair with
          # `bun tauri signer generate`, set the pubkey + endpoints in tauri.conf.json,
          # flip createUpdaterArtifacts to true, add TAURI_SIGNING_* below, then add
          # `includeUpdaterJson: true` to emit latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Platform code signing is intentionally not wired up yet (installers ship
          # unsigned). To sign, add the certs/creds as repository secrets and set the
          # matching tauri-action env: macOS -> APPLE_CERTIFICATE,
          # APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
          # APPLE_PASSWORD (app-specific), APPLE_TEAM_ID for Developer ID signing +
          # notarization; Windows -> a code-signing certificate configured via
          # tauri.conf.json bundle.windows.certificateThumbprint (or an external
          # signing command). No certs or keys are committed to this repo.
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: Facet v${{ steps.version.outputs.version }}
          releaseDraft: true
