server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers, mirroring @omnidotdev/providers SECURITY_HEADERS. No CSP:
  # the Studio evaluates user models with `new Function`, matching the fleet
  # standard which also omits CSP.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

  # SPA: fall back to index.html for client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Fingerprinted assets can be cached hard. This location declares its own
  # add_header, which drops the server-level ones, so they are repeated here.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
  }
}
