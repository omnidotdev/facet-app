server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: fall back to index.html for client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Fingerprinted assets can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
