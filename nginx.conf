server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers, mirroring @omnidotdev/providers SECURITY_HEADERS. No CSP:
  # the Studio evaluates user models with `new Function`, matching the fleet
  # standard which also omits CSP.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

  # SPA: fall back to index.html for client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The SPA entry must never be cached: a stale index.html points at hashed
  # bundle files that the next deploy deletes, so the app fails to load until a
  # hard refresh. `no-cache` lets the browser store it but always revalidate, so
  # a new deploy is picked up immediately. Both `/` (via the index directive)
  # and client routes (via the try_files fallback) internally redirect here.
  # add_header does not inherit once a location declares its own, so the
  # server-level security headers are repeated (as in /assets/).
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
  }

  # Fingerprinted assets can be cached hard. This location declares its own
  # add_header, which drops the server-level ones, so they are repeated here.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
  }
}
