[package]
name = "facet-kernel"
version = "0.1.0"
edition = "2021"
description = "Facet geometry kernel (Rust -> WASM). P1: mesh CSG; P2 target: truck B-rep."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
