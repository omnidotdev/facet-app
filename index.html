<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No-flash theme guard: stamp data-theme on <html> BEFORE first paint so
         the design tokens (which switch on [data-theme]) resolve to the right
         theme immediately, with no flash of the light default before the app
         hydrates. Must mirror getInitialTheme() in src/theme.ts: saved choice,
         else OS preference, else dark -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("facet-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <!-- viewport-fit=cover so env(safe-area-inset-*) reports real values on iOS/
         notched devices (required for safe-area padding on fixed nav bars, etc.) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Facet - code CAD</title>
    <meta
      name="description"
      content="Code-first parametric CAD in the browser. Write code, a real geometry kernel builds it, and export a print-ready STL."
    />
    <meta name="theme-color" content="#0b1c2e" />
    <link rel="canonical" href="https://facet.omni.dev/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Facet" />
    <meta property="og:title" content="Facet - code CAD" />
    <meta
      property="og:description"
      content="Code-first parametric CAD in the browser. Write code, a real geometry kernel builds it, and export a print-ready STL."
    />
    <meta property="og:url" content="https://facet.omni.dev/" />
    <meta property="og:image" content="https://facet.omni.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Facet - write code, get geometry. Code-first parametric CAD."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Facet - code CAD" />
    <meta
      name="twitter:description"
      content="Code-first parametric CAD in the browser. Write code, a real geometry kernel builds it, and export a print-ready STL."
    />
    <meta name="twitter:image" content="https://facet.omni.dev/og.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <!-- .ico fallback for surfaces that don't read SVG favicons (link previews, iMessage) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- The web app manifest and its <link> are generated and injected by
         vite-plugin-pwa (see vite.config.ts), so none is declared here -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
