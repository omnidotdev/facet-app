<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Facet</title>
  <!-- A faceted amber gem (top view): table + crown facets, lit from top-left. -->
  <g stroke="#7a3814" stroke-width="0.6" stroke-opacity="0.35" stroke-linejoin="round">
    <!-- crown facets -->
    <polygon points="4,32 32,4 32,19 19,32" fill="#ee9a5b"/>
    <polygon points="32,4 60,32 45,32 32,19" fill="#e07c3e"/>
    <polygon points="60,32 32,60 32,45 45,32" fill="#b05a24"/>
    <polygon points="32,60 4,32 19,32 32,45" fill="#c56a2e"/>
    <!-- table (split for a girdle crease) -->
    <polygon points="32,19 45,32 19,32" fill="#f4b074"/>
    <polygon points="45,32 32,45 19,32" fill="#e79256"/>
  </g>
  <!-- crisp outline -->
  <polygon points="32,4 60,32 32,60 4,32" fill="none" stroke="#7a3814" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
